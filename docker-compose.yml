version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: aibiomaterial_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aibiomaterial
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: aibiomaterial_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://user:userpassword@db:3306/aibiomaterial
    depends_on:
      - db

  frontend:
    build: ./frontend-web
    container_name: aibiomaterial_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
